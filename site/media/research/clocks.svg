<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="EUROPA Clock: preserve uncertainty in event ordering"><rect width="1000" height="590" rx="16" fill="#0b192e"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" fill="#f5f8ff" text-anchor="start">EUROPA Clock: preserve uncertainty in event ordering</text><text x="35" y="76" font-size="15" fill="#5be0ce" text-anchor="start">Derived from Synthetic | declared clock error bounds</text><text x="35" y="160" font-size="17" fill="#5be0ce" text-anchor="start">sensor</text><path d="M152.00 190 H380.00" stroke="#5be0ce" stroke-width="12"/><circle cx="266.00" cy="190" r="8" fill="white"/><text x="395.0" y="195" font-size="14" fill="#c9d9ee" text-anchor="start">[96, 104] s</text><text x="35" y="260" font-size="17" fill="#9dbdff" text-anchor="start">gateway</text><path d="M180.50 290 H522.50" stroke="#9dbdff" stroke-width="12"/><circle cx="351.50" cy="290" r="8" fill="white"/><text x="537.5" y="295" font-size="14" fill="#c9d9ee" text-anchor="start">[97, 109] s</text><text x="35" y="360" font-size="17" fill="#ffcb78" text-anchor="start">archive</text><path d="M779.00 390 H893.00" stroke="#ffcb78" stroke-width="12"/><circle cx="836.00" cy="390" r="8" fill="white"/><text x="908.0" y="395" font-size="14" fill="#c9d9ee" text-anchor="start">[118, 122] s</text><text x="123.5" y="464" font-size="13" fill="#c9d9ee" text-anchor="middle">95</text><text x="266.0" y="464" font-size="13" fill="#c9d9ee" text-anchor="middle">100</text><text x="408.5" y="464" font-size="13" fill="#c9d9ee" text-anchor="middle">105</text><text x="551.0" y="464" font-size="13" fill="#c9d9ee" text-anchor="middle">110</text><text x="693.5" y="464" font-size="13" fill="#c9d9ee" text-anchor="middle">115</text><text x="836.0" y="464" font-size="13" fill="#c9d9ee" text-anchor="middle">120</text><text x="500" y="496" font-size="15" fill="#c9d9ee" text-anchor="middle">Observed timestamp with declared closed uncertainty interval (seconds)</text><text x="95" y="531" font-size="15" fill="#c9d9ee" text-anchor="start">Sensor/gateway ordering is indeterminate; both precede archive.</text><text x="35" y="560" font-size="13" fill="#c9d9ee" text-anchor="start">Intervals establish temporal precedence, not causality; timestamp sort reverses two fixture events.</text></g></svg>
