name: Atlas integrity

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 150 missions, citations, catalog, and visuals
        run: python scripts/build_atlas.py --check
