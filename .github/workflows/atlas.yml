name: Atlas integrity and NIGHTSHIFT Pages

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check 150 missions, citations, catalog, and visuals
        run: python scripts/build_atlas.py --check

      - name: Check graduate research extension and deterministic experiments
        run: |
          python scripts/build_research.py --check
          python scripts/build_assessment.py --check
          python -m experiments.benchmark --check
          python scripts/build_research_visuals.py --check
          python -m unittest discover -s tests -v

      - name: Check beginner tool guides, source catalog, and local HTTP tutorial
        run: python scripts/check_foundations.py --smoke

      - name: Check public community source receipts and credits
        run: python scripts/build_community.py --check

      - name: Check static learning site, catalog coverage and document references
        run: |
          python scripts/build_site.py --check
          python scripts/check_site.py

  deploy:
    name: Publish NIGHTSHIFT
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build static NIGHTSHIFT site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
